name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Playwright is not an npm dependency: it's installed globally, the way the
  # tests expect it (createRequire(import.meta.url)("playwright") via NODE_PATH).
  PLAYWRIGHT_VERSION: "1.63.0"

jobs:
  check:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # build + node --check on every JS file + runtime bundle duplicate names
      - run: npm run check

  test:
    name: Tests (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install Playwright (global) and Chromium
        run: |
          npm install -g "playwright@${PLAYWRIGHT_VERSION}"
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
          playwright install --with-deps chromium
      - name: npm test
        shell: bash
        run: npm test 2>&1 | tee test.log
      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          if-no-files-found: ignore

  test-ui:
    name: Browser tests (Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install Playwright (global), Chromium and Xvfb
        run: |
          npm install -g "playwright@${PLAYWRIGHT_VERSION}"
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
          playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends xvfb
      # builds dist/runtime, then runs the display tests under xvfb-run
      - name: npm run test:ui
        shell: bash
        run: npm run test:ui 2>&1 | tee test-ui.log
      - name: Upload docs/ui and the log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui
          path: |
            docs/ui
            test-ui.log
          if-no-files-found: ignore

  # The real-app tests on a Mac: Tunes (a real Electron app, demo/electron-app)
  # opened with Morse and with Morse Desktop, the shortcut pressed, a change
  # made and saved. Free on a public repository; only on pushes to main.
  mac:
    name: Real apps on macOS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright (global) and Electron
        run: |
          npm install -g "playwright@${PLAYWRIGHT_VERSION}"
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
          npm install --prefix ~/.cache/morse/electron electron
          # Electron's own download runs in its postinstall; run it again to be
          # sure, and stop here if the runtime isn't there.
          (cd ~/.cache/morse/electron/node_modules/electron && node install.js)
          ls ~/.cache/morse/electron/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron
      - run: node scripts/build.js
      - name: Real Electron and Morse Desktop on macOS
        shell: bash
        env:
          MORSE_TRACE: ${{ github.workspace }}/trace.log
        run: node --test --test-timeout=300000 tests/electron.test.js tests/desktop-app-ui.test.js tests/pipe.test.js 2>&1 | tee mac.log
      - name: Upload the log and trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            mac.log
            trace.log
