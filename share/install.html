<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Install a Morse mod</title>
<link rel="stylesheet" href="../design/tokens.css">
<style>
  /* Tokens only (design/tokens.css): monochrome, 4px grid, radii 6/10/14. */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--m-bg); color: var(--m-text); font: 400 15px/1.55 var(--m-font); letter-spacing: var(--m-tracking); }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: var(--m-text-xl); }
  .logo { display: grid; grid-template-columns: repeat(4, 5px); gap: 2px; }
  .logo i { width: 5px; height: 5px; border-radius: 1.5px; background: var(--m-signal-4); }
  .logo i.o { opacity: .3; } .logo i.c { visibility: hidden; }
  h1 { font-size: 32px; line-height: 40px; font-weight: 650; letter-spacing: -0.02em; margin: 32px 0 8px; overflow-wrap: anywhere; }
  .prompt { font-size: 19px; line-height: 28px; color: var(--m-text-2); margin: 0 0 8px; overflow-wrap: anywhere; }
  .meta { margin: 0 0 24px; color: var(--m-text-3); font: 12px/18px var(--m-mono); letter-spacing: 0; overflow-wrap: anywhere; }
  section.does { border: 1px solid var(--m-line-strong); border-radius: var(--m-r-lg); background: var(--m-surface); padding: 20px 24px 24px; }
  h2 { font: 500 var(--m-text-xs)/16px var(--m-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--m-text-3); margin: 0 0 16px; }
  ul.items { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px 24px; }
  ul.items li { position: relative; padding-left: 22px; }
  ul.items li::before { content: ""; position: absolute; left: 4px; top: 9px; width: 7px; height: 7px; border-radius: 2px; background: var(--m-signal-3); }
  ul.items b { display: block; font-weight: 550; line-height: 24px; }
  ul.items small { display: block; color: var(--m-text-2); font-size: var(--m-text-md); line-height: 20px; }
  .note { margin: 20px 0 0; padding: 12px 16px; border: 1px solid var(--m-line-strong); border-left: 2px solid var(--m-warn); border-radius: var(--m-r-sm); background: var(--m-raised); line-height: 22px; }
  .note b { display: block; color: var(--m-warn); font: 600 var(--m-text-xs)/16px var(--m-mono); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 24px 0 8px; }
  button, a.btn { font: 500 14px/20px var(--m-font); padding: 10px 16px; border-radius: var(--m-r-md); border: 1px solid var(--m-line-strong); background: transparent; color: var(--m-text); cursor: pointer; text-decoration: none; transition: background var(--m-fast), border-color var(--m-fast); }
  button:hover, a.btn:hover { background: var(--m-hover); border-color: var(--m-signal-1); }
  button.primary { background: var(--m-primary); border-color: var(--m-primary); color: var(--m-primary-text); font-weight: 600; min-width: 120px; }
  button.primary:hover { background: var(--m-primary-hover); }
  :focus-visible { outline: 2px solid var(--m-signal-3); outline-offset: 2px; }
  #status { color: var(--m-text-2); font-size: 14px; min-height: 22px; margin: 0 0 24px; }
  #status code { font: 13px var(--m-mono); }
  .err { color: var(--m-danger); }
  details.code { margin-top: 8px; border-top: 1px solid var(--m-line); padding-top: 16px; }
  details.code summary { cursor: pointer; color: var(--m-text-2); font-weight: 500; display: inline-flex; align-items: center; gap: 8px; list-style: none; border-radius: var(--m-r-sm); }
  details.code summary::-webkit-details-marker { display: none; }
  details.code summary::before { content: ""; border-style: solid; border-width: 5px 0 5px 7px; border-color: transparent transparent transparent currentColor; transition: transform var(--m-fast); }
  details.code[open] summary::before { transform: rotate(90deg); }
  details.code summary:hover { color: var(--m-text); }
  h3 { font: 500 var(--m-text-xs)/16px var(--m-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--m-text-3); margin: 20px 0 8px; }
  pre { background: var(--m-surface); color: var(--m-text); border: 1px solid var(--m-line-strong); border-radius: var(--m-r-md); padding: 14px; overflow: auto; font: 12.5px/1.6 var(--m-mono); letter-spacing: 0; max-height: 360px; margin: 0; }
  .fine { margin-top: 32px; color: var(--m-text-3); font-size: 13px; line-height: 20px; }
  .fine kbd { font: 11px/14px var(--m-mono); border: 1px solid var(--m-line-strong); border-radius: 4px; padding: 0 4px; color: var(--m-text-2); background: var(--m-raised); }
  @media (max-width: 560px) { main { padding-top: 32px; } h1 { font-size: 26px; line-height: 32px; } section.does { padding: 16px; } }
</style>
</head>
<body>
<main>
  <div class="brand"><span class="logo" aria-hidden="true"><i class="c"></i><i class="o"></i><i class="o"></i><i class="c"></i><i class="o"></i><i></i><i></i><i class="o"></i><i class="o"></i><i></i><i></i><i class="o"></i><i class="c"></i><i class="o"></i><i class="o"></i><i class="c"></i></span>morse</div>
  <div id="root"><p id="status">Reading mod…</p></div>
</main>
<script type="module">
  import { decodeShare, toUserscript } from "../core/mod.js";
  import { summarizeMod } from "../core/summary.js";
  const root = document.getElementById("root");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  try {
    const mod = await decodeShare(location.href);
    const where = mod.match?.app || (mod.match?.hosts || []).map(h => h === "*" ? "every website" : h).join(", ") || "any site";
    const sum = summarizeMod(mod);
    const items = sum.empty
      ? `<li><b>Doesn't change anything</b><small>It has no code.</small></li>`
      : sum.items.map(i => `<li data-s="${i.id}"><b>${esc(i.text)}</b>${i.detail ? `<small>${esc(i.detail)}</small>` : ""}</li>`).join("");
    document.title = `Install “${mod.title}” · Morse`;
    root.innerHTML = `
      <h1>${esc(mod.title)}</h1>
      <p class="prompt">“${esc(mod.prompt)}”</p>
      <p class="meta">For ${esc(where)}${mod.author ? ` · made by ${esc(mod.author)}` : ""}${mod.model ? ` · written by ${esc(mod.model)}` : ""}</p>
      <section class="does" aria-labelledby="does-h">
        <h2 id="does-h">What this mod does</h2>
        <ul class="items">${items}</ul>
        ${sum.notes.map(n => `<p class="note" data-s="${n.id}"><b>Note</b>${esc(n.text)}</p>`).join("")}
      </section>
      <div class="actions">
        <button class="primary" id="install">Install</button>
        <a class="btn" id="userscript" download>Download .user.js</a>
      </div>
      <p id="status" role="status"></p>
      <details class="code" id="code">
        <summary>Show code</summary>
        ${mod.css.trim() ? `<h3>CSS</h3><pre>${esc(mod.css)}</pre>` : ""}
        ${mod.js.trim() ? `<h3>JavaScript</h3><pre>${esc(mod.js)}</pre>` : ""}
      </details>
      <p class="fine">A mod is code that runs inside ${esc(where)}, where it can see what you see. The list above is worked out from the code itself, and it errs on the side of mentioning things. Once installed, every mod can be turned off at once with <kbd>⌥⇧0</kbd> (Alt+Shift+0), and Morse can be paused on any site.</p>`;
    const us = document.getElementById("userscript");
    us.href = URL.createObjectURL(new Blob([toUserscript(mod)], { type: "text/javascript" }));
    us.download = `${mod.title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "mod"}.user.js`;
    const status = document.getElementById("status");
    document.getElementById("install").onclick = () => {
      if (document.documentElement.dataset.morseExtension) {
        // Morse shows its own copy of this review; it installs only from there.
        window.postMessage({ morseInstall: location.href }, "*");
        status.textContent = "Morse opened its install window on this page. Press Install there to finish.";
      } else {
        navigator.clipboard?.writeText(location.href).catch(() => {});
        status.innerHTML = mod.match?.app
          ? `Link copied. In a terminal run <code>morse import "&lt;link&gt;"</code>, or paste it into Morse → Mods → Import.`
          : `Morse isn't installed in this browser. Link copied: paste it into Morse → Mods → Import, or use the .user.js with Tampermonkey.`;
      }
    };
    window.addEventListener("message", e => {
      if (e.source !== window || !e.data?.morseInstalled) return;
      const r = e.data.morseInstalled;
      status.innerHTML = r.error ? `<span class="${/Not installed/.test(r.error) ? "" : "err"}">${esc(r.error)}</span>` : `Installed “${esc(r.title)}”. Open ${esc(where)} to see it.`;
    });
  } catch (e) {
    root.innerHTML = `<h1>That link doesn't contain a mod</h1><p class="err">${esc(e.message)}</p>`;
  }
</script>
</body>
</html>
