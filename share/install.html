<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Install a Morse mod</title>
<meta name="description" content="Someone shared a Morse mod with you. Read its code, then install it in Morse or download it for Tampermonkey.">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="../site/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../design/tokens.css">
<link rel="stylesheet" href="../site/site.css">
<style>
  .i-main { max-width: calc(760px + 2 * var(--s-gutter)); padding-top: 64px; padding-bottom: 96px; }
  .i-main h1 { font-size: clamp(32px, 5vw, 44px); line-height: 1.1; letter-spacing: -0.035em; }
  .i-prompt { margin-top: 12px; color: var(--m-text-2); font-size: 19px; line-height: 1.5; }
  .i-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 24px; }
  .i-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 32px; }
  #status { min-height: 24px; margin-top: 16px; color: var(--m-text-2); font-size: 14px; line-height: 22px; }
  #status:empty { min-height: 0; margin-top: 0; }
  #status .ok { display: inline-flex; align-items: center; gap: 8px; vertical-align: top; color: var(--m-text); font-weight: 500; }
  .err { color: var(--m-danger); }
  .i-warn {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    padding: 12px 16px;
    border: 1px solid var(--m-line-strong);
    border-radius: var(--m-r-md);
    background: var(--m-surface);
    color: var(--m-text-2);
    font-size: 14px;
    line-height: 22px;
  }
  .i-warn svg { flex: none; margin-top: 3px; color: var(--m-warn); }
  .i-warn b { color: var(--m-text); font-weight: 600; }
  .i-code h2 { display: flex; justify-content: space-between; margin: 40px 0 8px; color: var(--m-text-3); font: 500 12px/16px var(--m-mono); letter-spacing: .08em; text-transform: uppercase; }
  .i-code h2 span { letter-spacing: 0; text-transform: none; }
  .i-code pre.code { max-height: 420px; font-size: 12px; line-height: 20px; white-space: pre; }
  /* What this mod does (core/summary.js) */
  .i-does { margin-top: 32px; padding: 20px 24px 24px; border: 1px solid var(--m-line-strong); border-radius: var(--m-r-lg); background: var(--m-surface); }
  .i-does h2, .i-code summary { margin: 0 0 16px; color: var(--m-text-3); font: 500 12px/16px var(--m-mono); letter-spacing: .08em; text-transform: uppercase; }
  .i-items { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px 24px; }
  .i-items li { position: relative; padding-left: 20px; }
  .i-items li::before { content: ""; position: absolute; left: 3px; top: 9px; width: 7px; height: 7px; border-radius: 2px; background: var(--m-signal-3); }
  .i-items b { display: block; color: var(--m-text); font-weight: 500; line-height: 24px; }
  .i-items small { display: block; color: var(--m-text-2); font-size: 13px; line-height: 20px; }
  .i-note { display: flex; gap: 12px; margin: 20px 0 0; padding: 12px 16px; border: 1px solid var(--m-line-strong); border-radius: var(--m-r-md); background: var(--m-raised); color: var(--m-text); font-size: 14px; line-height: 22px; }
  .i-note svg { flex: none; margin-top: 3px; color: var(--m-warn); }
  .i-code { margin-top: 32px; }
  .i-code summary { display: inline-flex; align-items: center; gap: 8px; margin: 0; cursor: pointer; list-style: none; color: var(--m-text-2); }
  .i-code summary::-webkit-details-marker { display: none; }
  .i-code summary::before { content: ""; border-style: solid; border-width: 5px 0 5px 7px; border-color: transparent transparent transparent currentColor; transition: transform var(--m-fast); }
  .i-code[open] summary::before { transform: rotate(90deg); }
  .i-code summary:hover { color: var(--m-text); }
  .i-foot kbd { font: 11px/14px var(--m-mono); border: 1px solid var(--m-line-strong); border-radius: 4px; padding: 0 4px; color: var(--m-text-2); background: var(--m-raised); }
  .i-foot { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--m-line); color: var(--m-text-3); font-size: 13px; line-height: 20px; }
  .i-loading { display: flex; align-items: center; gap: 12px; color: var(--m-text-2); }
  /* packs hook: a pack link lists every mod in it (core/pack.js) */
  .p-mods { display: grid; gap: 16px; margin-top: 32px; }
  .p-mod { padding: 20px 24px; border: 1px solid var(--m-line-strong); border-radius: var(--m-r-lg); background: var(--m-surface); }
  .p-mod h2 { margin: 0; font-size: 20px; line-height: 28px; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .p-mod .i-prompt { margin-top: 4px; font-size: 15px; line-height: 22px; overflow-wrap: anywhere; }
  .p-mod .i-meta { margin-top: 12px; }
  .p-does { margin: 12px 0 0; color: var(--m-text); font-size: 14px; line-height: 22px; }
  .p-mod .i-code { margin-top: 16px; }
  @media (max-width: 720px) {
    .i-main { padding-top: 40px; padding-bottom: 64px; }
    .i-prompt { font-size: 17px; }
    .i-actions .btn { flex: 1 1 auto; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="../site/" aria-label="Morse home"><span data-radar="20"></span>Morse</a>
    <nav class="nav" aria-label="Main">
      <a href="../site/gallery.html" data-i18n="install.nav.gallery">Gallery</a>
      <a href="../site/" data-i18n="install.nav.what">What is Morse?</a>
    </nav>
  </div>
</header>
<main class="wrap i-main">
  <div id="root"><p id="status" class="i-loading"><span data-radar="16"></span><span data-i18n="install.opening">Opening the mod…</span></p></div>
</main>
<script type="module">
  import { decodeShare, decodeShareText, toUserscript } from "../core/mod.js";
  import { parsePack, isPack, packFilename } from "../core/pack.js"; // packs hook
  import { initPage, highlight, esc } from "../site/common.js";
  import { mountAll } from "../site/radar.js";
  import { summarizeMod, whereRuns, modHosts, broadEndings } from "../core/summary.js";
  import { t, setLanguage, pickLanguage, translatePage } from "../core/i18n.js";

  // This page has no Morse settings to read: it follows the browser's language.
  setLanguage(pickLanguage(navigator.languages?.length ? navigator.languages : [navigator.language]));
  translatePage(document);
  initPage();
  addEventListener("hashchange", () => location.reload());
  const root = document.getElementById("root");
  const check = `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`;
  const warn = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 1.75l6.5 11.5h-13z" stroke-linejoin="round"/><path d="M8 6.5v3"/><circle cx="8" cy="11.5" r=".5" fill="currentColor"/></svg>`;
  const lines = s => t("install.lines", { n: s.trimEnd().split("\n").length });
  // packs hook: a link can carry a pack; it gets its own page (showPack, below).
  const pack = await decodeShareText(location.href).then(txt => { try { return isPack(JSON.parse(txt)) ? txt : null; } catch { return null; } }, () => null);
  if (pack) showPack(pack);
  else try {
    const mod = await decodeShare(location.href);
    const where = whereRuns(mod); // the same rule Morse uses to decide where it runs
    const everywhere = !mod.match?.app && !!modHosts(mod)?.includes("*");
    document.title = t("install.docTitle", { title: mod.title });
    // What it does, in plain words, worked out from the code itself.
    const sum = summarizeMod(mod);
    const items = sum.empty
      ? `<li><b>${esc(t("sum.empty"))}</b><small>${esc(t("install.noCode"))}</small></li>`
      : sum.items.map(i => `<li data-s="${i.id}"><b>${esc(i.text)}</b>${i.detail ? `<small>${esc(i.detail)}</small>` : ""}</li>`).join("");
    root.innerHTML = `
      <p class="eyebrow"><span data-radar="14" data-still></span>${esc(t("install.eyebrow"))}</p>
      <h1>${esc(mod.title)}</h1>
      <p class="i-prompt">“${esc(mod.prompt)}”</p>
      <div class="i-meta"><span class="chip">${esc(t("install.for", { where }))}</span>${mod.css.trim() ? `<span class="chip">${esc(t("panel.tag.style"))}</span>` : ""}${mod.js.trim() ? `<span class="chip">${esc(t("panel.tag.script"))}</span>` : ""}${mod.model ? `<span class="chip">${esc(t("install.madeWith", { model: mod.model }))}</span>` : ""}</div>
      <section class="i-does" aria-labelledby="does">
        <h2 id="does">${esc(t("install.does"))}</h2>
        <ul class="i-items">${items}</ul>
        ${everywhere ? `<p class="i-note" data-s="everywhere">${warn}<span>${esc(t("install.everywhere"))}</span></p>`
          : broadEndings(mod).length ? `<p class="i-note" data-s="everywhere">${warn}<span>${esc(t("install.broad", { endings: broadEndings(mod).join(t("install.or")) }))}</span></p>` : ""}
        ${sum.notes.map(n => `<p class="i-note" data-s="${n.id}">${warn}<span>${esc(n.text)}</span></p>`).join("")}
      </section>
      <div class="i-actions">
        <button class="btn primary" type="button" id="install">${esc(t("install.install"))}</button>
        <a class="btn" id="userscript" download>${esc(t("install.tampermonkey"))}</a>
      </div>
      <p id="status" role="status"></p>
      <details class="i-code" id="code">
        <summary>${esc(t("ctl.showCode"))}</summary>
        ${mod.css.trim() ? `<h2>${esc(t("install.code.style"))} <span>${lines(mod.css)}</span></h2><pre class="code">${highlight(mod.css.trimEnd(), "css")}</pre>` : ""}
        ${mod.js.trim() ? `<h2>${esc(t("install.code.script"))} <span>${lines(mod.js)}</span></h2><pre class="code">${highlight(mod.js.trimEnd(), "js")}</pre>` : ""}
      </details>
      <p class="i-foot">${t("install.foot")}</p>`;
    mountAll(root);
    const us = document.getElementById("userscript");
    us.href = URL.createObjectURL(new Blob([toUserscript(mod)], { type: "text/javascript" }));
    us.download = `${mod.title.toLowerCase().replace(/[^a-z0-9]+/g, "-")}.user.js`;
    const status = document.getElementById("status");
    document.getElementById("install").onclick = () => {
      if (document.documentElement.dataset.morseExtension) {
        window.postMessage({ morseInstall: location.href }, "*");
        status.textContent = t("install.checkWindow");
      } else {
        navigator.clipboard?.writeText(location.href).catch(() => {});
        status.innerHTML = mod.match.app ? t("install.copied.app") : esc(t("install.copied.web"));
      }
    };
    window.addEventListener("message", e => {
      if (e.source !== window || !e.data?.morseInstalled) return;
      const r = e.data.morseInstalled;
      status.innerHTML = r.error ? `<span class="err">${esc(r.error)}</span>` : `<span class="ok">${check}${esc(t("install.installed", { title: r.title }))}</span> ${esc(t("install.openIt", { where }))}`;
    });
  } catch (e) {
    root.innerHTML = `
      <p class="eyebrow">${esc(t("install.eyebrow"))}</p>
      <h1>${esc(t("install.bad.h"))}</h1>
      <p class="i-prompt">${t("install.bad")}</p>
      ${/^This /.test(e.message) ? `<p class="err" style="margin-top:16px;font-size:14px">${esc(e.message)}</p>` : ""}`;
  }
  // ---- packs hook: every mod in the pack, what each does and where, its code.
  // Install hands the link to Morse, whose own review lets you untick mods.
  function showPack(text) {
    let p;
    try { p = parsePack(text); }
    catch (e) {
      root.innerHTML = `<p class="eyebrow">Shared pack</p><h1>This pack can't be installed.</h1><p class="i-prompt">${esc(e.message)}</p>`;
      return;
    }
    const { pack, errors } = p;
    document.title = `${pack.name} · Morse pack`;
    const modHtml = m => {
      const sum = summarizeMod(m), wide = !m.match?.app && !!modHosts(m)?.includes("*");
      const does = sum.empty ? "Doesn't change anything" : sum.items.filter(i => i.id !== "code").map(i => i.text).join(" · ");
      return `<section class="p-mod">
        <h2>${esc(m.title)}</h2>
        <p class="i-prompt">“${esc(m.prompt)}”</p>
        <div class="i-meta"><span class="chip">for ${esc(whereRuns(m))}</span>${m.css.trim() ? `<span class="chip">style</span>` : ""}${m.js.trim() ? `<span class="chip">script</span>` : ""}</div>
        <p class="p-does">${esc(does)}</p>
        ${wide ? `<p class="i-note" data-s="everywhere">${warn}<span>This mod runs on every website you visit, not just one. It can see what you see on all of them.</span></p>`
          : broadEndings(m).length ? `<p class="i-note" data-s="everywhere">${warn}<span>This mod runs on every website whose address ends in ${esc(broadEndings(m).join(" or "))}, not just one. It can see what you see on all of them.</span></p>` : ""}
        ${sum.notes.map(n => `<p class="i-note" data-s="${n.id}">${warn}<span>${esc(n.text)}</span></p>`).join("")}
        <details class="i-code"><summary>Show code</summary>
          ${m.css.trim() ? `<h2>Style (CSS) <span>${lines(m.css)}</span></h2><pre class="code">${highlight(m.css.trimEnd(), "css")}</pre>` : ""}
          ${m.js.trim() ? `<h2>Script (JavaScript) <span>${lines(m.js)}</span></h2><pre class="code">${highlight(m.js.trimEnd(), "js")}</pre>` : ""}
        </details>
      </section>`;
    };
    const n = pack.mods.length;
    root.innerHTML = `
      <p class="eyebrow"><span data-radar="14" data-still></span>Shared pack</p>
      <h1>${esc(pack.name)}</h1>
      ${pack.note ? `<p class="i-prompt">“${esc(pack.note)}”</p>` : ""}
      <div class="i-meta"><span class="chip">${n} mod${n === 1 ? "" : "s"}</span>${pack.author ? `<span class="chip">by ${esc(pack.author)}</span>` : ""}</div>
      <div class="i-actions">
        <button class="btn primary" type="button" id="install">Install…</button>
        <a class="btn" id="file" download>Download pack file</a>
      </div>
      <p id="status" role="status"></p>
      <div class="p-mods">${pack.mods.map(modHtml).join("")}</div>
      ${errors.length ? `<p class="i-foot">Left out: ${esc(errors.join("; "))}</p>` : ""}
      <p class="i-foot">A pack is a few mods shared together. A mod is a change to a website or app, made with Morse. When you install the pack, Morse shows each mod again, and you can untick the ones you don't want. The whole pack is in the link, after the <code>#</code>. Browsers never send that part to a server. The lists above come from reading the code, and they mention anything the code might do.</p>`;
    mountAll(root);
    const file = document.getElementById("file");
    file.href = URL.createObjectURL(new Blob([JSON.stringify(pack, null, 2)], { type: "application/json" }));
    file.download = packFilename(pack);
    const status = document.getElementById("status");
    document.getElementById("install").onclick = () => {
      if (document.documentElement.dataset.morseExtension) {
        window.postMessage({ morseInstall: location.href }, "*");
        status.textContent = "Check the Morse window on this page: choose the mods you want, then press Install.";
      } else {
        navigator.clipboard?.writeText(location.href).catch(() => {});
        status.innerHTML = `Morse isn't installed in this browser. The link is copied: paste it into Morse under Mods → Install a mod…, or run <code>morse pack install "&lt;link&gt;"</code> in a terminal.`;
      }
    };
    window.addEventListener("message", e => {
      if (e.source !== window || !e.data?.morseInstalled) return;
      const r = e.data.morseInstalled;
      status.innerHTML = r.error ? `<span class="err">${esc(r.error)}</span>` : `<span class="ok">${check}Installed ${esc(String(r.count ?? ""))} mod${r.count === 1 ? "" : "s"} from “${esc(r.title)}”.</span>`;
    });
  }
</script>
</body>
</html>
