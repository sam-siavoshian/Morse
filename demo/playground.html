<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Morse playground</title>
<style>
  body { margin: 0; min-height: 100vh; font: 15px/1.5 Inter, system-ui, sans-serif; background: var(--bg, #0e0e10); color: var(--fg, #e7e7ea); display: grid; place-items: center; }
  body.light { --bg: #f6f6f7; --fg: #1a1a1d; }
  .stage { display: grid; gap: 24px; width: 720px; }
  .toolbar { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 12px; background: color-mix(in srgb, var(--fg) 6%, transparent); }
  .toolbar button { background: none; border: 0; color: inherit; font: inherit; opacity: .7; }
  .card { padding: 20px; border-radius: 14px; background: color-mix(in srgb, var(--fg) 5%, transparent); height: 220px; }
  .extras { display: flex; gap: 16px; align-items: center; font-size: 13px; }
  .extras iframe { width: 180px; height: 40px; border: 1px solid color-mix(in srgb, var(--fg) 15%, transparent); border-radius: 8px; }
</style>
</head>
<body>
<!-- Dev playground: the real runtime with a fake host that streams canned
     tokens, so the UI and effect can be iterated on without a model.
     Open with ?light for the light theme, ?reset to forget saved mods,
     ?model=demo to generate with the real engine and the demo model.
     Mods and the God mode clipboard persist in localStorage, and mod JS runs
     through the real helper kit, so manual edits re-apply after a reload. -->
<div class="stage">
  <div class="toolbar" id="toolbar"><button>⤮</button><button>⏮</button><button>▶</button><button>⏭</button><button>↻</button><span style="flex:1"></span><button>Settings</button></div>
  <div class="card" id="card"><h3 style="margin:0 0 8px">Release notes</h3><p style="margin:0;opacity:.7">Pointing at things and describing what you want is the whole interface.</p></div>
  <div class="extras" id="extras"><span id="mixed">Press <b>Alt+Space</b> to start</span><x-badge id="badge"></x-badge><iframe title="Embedded" srcdoc="<p style='margin:8px;font:12px system-ui'>An embedded frame</p>"></iframe></div>
</div>
<script>
  if (location.search.includes("light")) document.body.classList.add("light");
  if (location.search.includes("reset")) Object.keys(localStorage).filter(k => k.startsWith("morse:playground:")).forEach(k => localStorage.removeItem(k));
  localStorage.setItem("morse:debug", "1");
  // A web component with an open shadow root, for God mode's shadow DOM path.
  customElements.define("x-badge", class extends HTMLElement {
    constructor() { super(); this.attachShadow({ mode: "open" }).innerHTML = `<style>span{padding:2px 8px;border-radius:99px;border:1px solid currentColor;opacity:.8}</style><span class="label">Shadow badge</span>`; }
  });
  // ?ask: a small notes app for Ask and find (tests/ask.test.js): tabs, a
  // greyed-out button, and a More menu that hides Export. Every click on the
  // page is logged with isTrusted, to prove Morse never clicks for the user.
  const ASK = location.search.includes("ask");
  const fake = window.__fake = { asks: [], clicks: [] };
  if (ASK) {
    document.querySelector(".stage").insertAdjacentHTML("beforeend", `
      <div class="toolbar" id="appbar" style="position:relative">
        <b>Notes</b>
        <div role="tablist" aria-label="Views" style="display:flex;gap:4px"><button role="tab" aria-selected="true">All notes</button><button role="tab" aria-selected="false">Shared</button></div>
        <span style="flex:1"></span>
        <button id="publish" disabled title="Add a title first">Publish</button>
        <button id="more" aria-label="More options" aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu">⋯</button>
        <style>#more-menu:not([hidden]) { display: grid; } #more-menu button { text-align: left; padding: 6px 10px; opacity: 1; }</style>
        <div id="more-menu" role="menu" aria-label="More options" hidden style="position:absolute;right:8px;top:48px;padding:6px;border-radius:10px;background:var(--bg);box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:2">
          <button role="menuitem" id="export">Export as PDF</button>
          <button role="menuitem" data-item="notifications">Notification settings</button>
          <button role="menuitem">Help</button>
        </div>
      </div>`);
    const more = document.getElementById("more"), menu = document.getElementById("more-menu");
    const setOpen = open => { menu.hidden = !open; more.setAttribute("aria-expanded", String(open)); };
    more.addEventListener("click", () => setOpen(menu.hidden));
    document.getElementById("export").addEventListener("click", () => { setOpen(false); fake.exported = (fake.exported || 0) + 1; });
    document.addEventListener("click", e => fake.clicks.push({ id: e.target.id || e.target.textContent.trim().slice(0, 20), trusted: e.isTrusted }), true);
  }
  const TEXT = "TITLE: Demo\n```css\n#toolbar { gap: 20px; letter-spacing: .02em; }\n#toolbar button { opacity: .9; }\n```\n```js\nmorse.watch('#toolbar', t => t.append(morse.el('span', { text: 'hello' })));\n```\n";
  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem("morse:playground:" + k)) ?? d; } catch { return d; } },
    set(k, v) { localStorage.setItem("morse:playground:" + k, JSON.stringify(v)); },
  };
  const core = Promise.all([import("/core/kit.js"), import("/core/mod.js"), import("/core/clipboard.js"), import("/core/control-host.js")]);
  // ?demoms=60 (or window.__demoMs) slows the demo model's replay, for tests that press Stop mid-stream.
  const demo = () => ({ provider: "demo", demoMs: Number(window.__demoMs || new URLSearchParams(location.search).get("demoms")) || undefined });
  const subs = [];
  const emit = m => subs.forEach(f => f(m));
  globalThis.__fakeEmit = emit; // tests: play host events (e.g. the share page's install.request)
  globalThis.__morseHost = {
    onMessage: fn => subs.push(fn),
    async send(m) {
      const reply = result => setTimeout(() => emit({ reply: m.id, result }), 10);
      const [kit, mod, clip, control] = await core;
      // User control (pause, safe start, install review, backup) through the real host logic.
      if (m.type.startsWith("control.") || m.type === "mods.preview") {
        globalThis.__ctl ||= control.controlHandler({
          load: () => store.get("control", {}), save: s => store.set("control", s),
          listMods: () => Object.values(store.get("mods", {})),
          putMods: list => { const all = store.get("mods", {}); for (const x of list) all[x.id] = x; store.set("mods", all); },
          onPause: pause => setTimeout(() => emit({ type: "control.changed", pause }), 0),
        });
        try { return reply(await __ctl(m, { url: m.url || location.href, app: null })); }
        catch (e) { return setTimeout(() => emit({ reply: m.id, error: e.message }), 10); }
      }
      if (m.type === "export") return reply({ path: "Downloads/morse/" + m.filename });
      if (m.type === "i18n.words") return reply(await (await import("/core/languages.js")).readWords(m.lang)); // the runtime carries English only
      if (m.type === "settings.get") return reply(store.get("settings", {}));
      if (m.type === "settings.set") {
        const cur = store.get("settings", {}), next = { ...cur };
        for (const [k, v] of Object.entries(m.settings || {})) next[k] = v && typeof v === "object" && !Array.isArray(v) ? { ...(cur[k] || {}), ...v } : v;
        store.set("settings", next);
        return reply(next);
      }
      // ?app=Obsidian: the page plays a desktop app's window (dogfood: the off switch names the app)
      const asApp = new URLSearchParams(location.search).get("app");
      if (m.type === "hello") return reply({ mode: asApp ? "desktop" : "playground", label: "playground · fake host", quiet: true, ...(asApp ? { app: asApp.toLowerCase(), appName: asApp } : {}) });
      if (m.type === "mods.list") return reply(Object.values(store.get("mods", {})).filter(x => mod.modMatches(x, { url: m.url || location.href, app: null })));
      if (m.type === "mods.save") {
        const x = m.draft ? mod.createMod({ ...m.draft, app: null, model: "playground" }) : m.mod;
        const all = store.get("mods", {}); all[x.id] = x; store.set("mods", all);
        return reply(x);
      }
      if (m.type === "mods.delete") { const all = store.get("mods", {}); delete all[m.modId]; store.set("mods", all); return reply(true); }
      const exec = (id, js) => {
        let r;
        try { r = (0, eval)(kit.wrapModCode(id, js)); } catch (e) { r = { ok: false, error: String(e.message || e) }; }
        const errs = r && r.ok ? morse.__errors(id) : [];
        return errs.length ? { ok: false, error: errs[0] } : r;
      };
      if (m.type === "exec") return reply(exec(m.modId, m.js));
      if (m.type === "off") { globalThis.morse?.__off(m.modId); return reply(true); }
      if (m.type === "stats") return reply(globalThis.morse?.__stats?.(m.modId) ?? null);
      if (m.type === "share" && m.kind === "link") return reply({ link: await mod.encodeShare(m.mod) });
      // ?model=demo: the real engine with the built-in demo model (core/demo.js),
      // so refine and fix run end to end: prompt, stream, parse, exec, repair.
      if (m.type === "generate" && new URLSearchParams(location.search).get("model") === "demo") {
        const { runMorse } = await import("/core/engine.js");
        const res = await runMorse({ settings: demo(), request: m.request, context: m.context, base: m.base,
          exec: async js => exec(m.genId, js), emit: ev => emit({ ...ev, genId: m.genId }) }).catch(e => ({ ok: false, error: e.message }));
        return reply({ ok: res.ok, error: res.error, title: res.title, css: res.css, js: res.js, attempts: res.attempts });
      }
      if (m.type === "clipboard.list") return reply(store.get("clipboard", []));
      if (m.type === "clipboard.put") { const l = clip.clipAdd(store.get("clipboard", []), m.item); store.set("clipboard", l); return reply(l); }
      if (m.type === "clipboard.remove") { const l = clip.clipDrop(store.get("clipboard", []), m.id); store.set("clipboard", l); return reply(l); }
      if (m.type === "generate" && ASK) {
        // ?ask: the real engine + parser with the demo model (core/demo.js),
        // replying the way the real hosts do (answers travel as events only).
        fake.asks.push({ request: m.request, ask: m.context.ask || null, outline: m.context.outline });
        const { runMorse } = await import("/core/engine.js");
        const res = await runMorse({
          settings: demo(), request: m.request, context: m.context,
          emit: ev => emit({ ...ev, genId: m.genId }),
          exec: async js => {
            try { const r = (0, eval)(kit.wrapModCode(m.genId, js)); const errs = r && r.ok ? morse.__errors(m.genId) : []; return errs.length ? { ok: false, error: errs[0] } : r; }
            catch (e) { return { ok: false, error: String(e.message || e) }; }
          },
        });
        return reply({ ok: res.ok, error: res.error, title: res.title, css: res.css, js: res.js, attempts: res.attempts });
      }
      if (m.type === "generate") {
        let i = 0;
        const speed = Number(new URLSearchParams(location.search).get("ms") || 30);
        const t = setInterval(() => {
          const tok = TEXT.slice(i, i += 4);
          emit({ type: "token", text: tok, genId: m.genId });
          if (i >= TEXT.length) { clearInterval(t); reply({ ok: true, title: "Demo", css: "", js: "", attempts: 1 }); }
        }, speed);
        return;
      }
      reply(null);
    },
  };
</script>
<script src="/dist/runtime/runtime.js"></script>
</body>
</html>
