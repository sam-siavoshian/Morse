<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Untitled sketch · Sketchpad</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: grid; grid-template-columns: 56px 1fr 220px; grid-template-rows: 46px 1fr; background: #e5e7eb; color: #1f2937; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  .top { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: #111827; color: #e5e7eb; }
  .top b { font-size: 14px; } .top .nm { color: #9ca3af; }
  .tools { background: #fff; border-right: 1px solid #d1d5db; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; }
  .tools button { width: 38px; height: 38px; border: 0; border-radius: 8px; background: none; font-size: 17px; cursor: pointer; }
  .tools button[aria-pressed="true"] { background: #e0e7ff; }
  .tools .sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #d1d5db; padding: 0; }
  .tools input[type=range] { width: 38px; }
  .stage { position: relative; display: grid; place-items: center; overflow: hidden; }
  #board { background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.12); cursor: crosshair; touch-action: none; }
  #mini { position: absolute; right: 14px; bottom: 14px; border: 1px solid #9ca3af; background: #fff; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .side { background: #fff; border-left: 1px solid #d1d5db; padding: 12px; }
  .side h4 { margin: 0 0 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #6b7280; }
  .side .ly { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 6px; } .side .ly.on { background: #eef2ff; }
  .side canvas { border: 1px solid #e5e7eb; }
</style>
</head>
<body>
  <div class="top"><b>Sketchpad</b><span class="nm">Untitled sketch</span></div>
  <div class="tools" role="toolbar" aria-label="Tools">
    <button aria-label="Pen" aria-pressed="true">✏️</button>
    <button aria-label="Eraser" aria-pressed="false">🧽</button>
    <button aria-label="Undo">↶</button>
    <button aria-label="Clear canvas" title="Clear canvas">🗑</button>
    <button class="sw" aria-label="Black" style="background:#111827"></button>
    <button class="sw" aria-label="Red" style="background:#dc2626"></button>
    <button class="sw" aria-label="Blue" style="background:#2563eb"></button>
    <input type="range" min="1" max="20" value="3" aria-label="Brush size">
  </div>
  <div class="stage">
    <canvas id="board" width="880" height="560" aria-label="Drawing"></canvas>
    <canvas id="mini" width="176" height="112" aria-label="Minimap"></canvas>
  </div>
  <aside class="side" aria-label="Layers">
    <h4>Layers</h4>
    <div class="ly on"><canvas width="40" height="26"></canvas>Sketch</div>
    <div class="ly"><canvas width="40" height="26"></canvas>Background</div>
  </aside>
<script>
// A canvas drawing app: everything you see on the board is pixels.
const board = document.getElementById("board"), g = board.getContext("2d");
const mini = document.getElementById("mini"), mg = mini.getContext("2d");
let color = "#111827", size = 3, erase = false, history = [];
function blank() { g.fillStyle = "#fff"; g.fillRect(0, 0, board.width, board.height); }
function sample() {
  blank();
  g.lineCap = "round"; g.lineJoin = "round";
  g.strokeStyle = "#2563eb"; g.lineWidth = 6; g.beginPath(); g.moveTo(80, 420); g.bezierCurveTo(220, 120, 420, 520, 620, 200); g.stroke();
  g.fillStyle = "#fde68a"; g.beginPath(); g.arc(700, 140, 70, 0, Math.PI * 2); g.fill();
  g.strokeStyle = "#dc2626"; g.lineWidth = 4; g.strokeRect(160, 90, 180, 120);
  g.fillStyle = "#111827"; g.font = "28px Georgia"; g.fillText("Ideas for the landing page", 300, 500);
}
function syncMini() { mg.clearRect(0, 0, mini.width, mini.height); mg.drawImage(board, 0, 0, mini.width, mini.height); }
function snapshot() { history.push(g.getImageData(0, 0, board.width, board.height)); if (history.length > 20) history.shift(); }
sample(); syncMini();
const at = e => { const r = board.getBoundingClientRect(); return [(e.clientX - r.left) * board.width / r.width, (e.clientY - r.top) * board.height / r.height]; };
let drawing = false;
board.addEventListener("pointerdown", e => { snapshot(); drawing = true; const [x, y] = at(e); g.beginPath(); g.moveTo(x, y); board.setPointerCapture(e.pointerId); });
board.addEventListener("pointermove", e => {
  if (!drawing) return;
  const [x, y] = at(e);
  g.strokeStyle = erase ? "#fff" : color; g.lineWidth = erase ? size * 4 : size; g.lineCap = "round";
  g.lineTo(x, y); g.stroke();
});
board.addEventListener("pointerup", () => { drawing = false; syncMini(); });
const tools = document.querySelector(".tools");
tools.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  const l = b.getAttribute("aria-label");
  if (l === "Pen" || l === "Eraser") { erase = l === "Eraser"; tools.querySelectorAll("[aria-pressed]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); }
  else if (l === "Undo") { const s = history.pop(); if (s) { g.putImageData(s, 0, 0); syncMini(); } }
  else if (l === "Clear canvas") { snapshot(); blank(); syncMini(); }
  else if (b.classList.contains("sw")) color = b.style.background;
});
tools.querySelector("input").addEventListener("input", e => { size = +e.target.value; });
</script>
</body>
</html>
