<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hostile</title>
<style>
  /* The worst global CSS we could think of. Morse's overlay must look exactly
     the same here as on a plain page: nothing below may reach into it. */
  html { zoom: 1.25; font-size: 40px !important; direction: rtl; writing-mode: horizontal-tb; }
  body, body * { all: unset; }
  body { display: block; transform: rotate(-1deg) translateY(8px); transform-origin: 0 0; background: #fff8e1; color: #3b2b00;
    font: italic 900 28px/3 "Comic Sans MS", cursive !important; letter-spacing: 3px !important; text-transform: uppercase !important; }
  div, span, button, input, textarea, label, header, footer, aside, article, p, b, small, kbd, em, i, img, canvas, svg {
    box-sizing: content-box !important; line-height: 3 !important; letter-spacing: 4px !important; text-transform: uppercase !important;
    border: 3px dashed #e00 !important; border-radius: 0 !important; color: #d00 !important; background-color: #ff0 !important;
    font-family: "Comic Sans MS", cursive !important; font-size: 30px !important; text-align: right !important; filter: hue-rotate(90deg);
    transition: all 3s !important; visibility: visible !important; zoom: 1.1; }
  [hidden] { display: block !important; }
  :focus { outline: 6px solid magenta !important; }
  ::selection { background: lime !important; }
  ::-webkit-scrollbar { width: 30px; background: red; }
  [data-morse-ui] { display: none !important; opacity: .1 !important; transform: scale(2) !important; inset: auto !important; width: 10px !important; height: 10px !important; }
  section { display: block; padding: 24px; margin: 24px; }
  h1 { display: block; font-size: 64px !important; }
  #tb { display: flex; gap: 20px; padding: 16px; margin: 0 24px; background: #ffe0b2; }
  #tb button { cursor: pointer; padding: 4px 12px; }
  #side { display: block; width: 260px; height: 320px; margin: 24px; background: #ffecb3; }
</style>
</head>
<body>
  <section><h1>صفحة معادية</h1><p>Global resets, huge fonts, zoom, RTL and a transformed body.</p></section>
  <div id="tb" aria-label="Hostile toolbar"><button aria-label="Bold">B</button><button aria-label="Italic">I</button><button aria-label="Underline">U</button><button>Publish</button></div>
  <div id="side" aria-label="Hostile sidebar">Sidebar</div>
<script>
// ?cover: a page that tries to draw over Morse's install review, so that a
// click meant for its "Claim your prize" lands on Install
// (tests/top-layer.test.js). On http://127.0.0.1:8787, the address the share
// page uses in tests, it can ask for an install like the share page does.
//   ask(source)          ask Morse to install a mod (the share page's message)
//   cover(how, opts)     draw a full-page cover: "z" (highest z-index), "popover",
//                        "shadow" (a popover inside a closed shadow root), "dialog"
//                        (a modal dialog); opts.through: clicks go through it to
//                        what is under it; opts.again: open it again whenever it
//                        is pushed down or closed
//   uncover()            remove every cover
if (/[?&]cover\b/.test(location.search)) {
  const covers = [];
  const style = "all: initial !important; position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100vh !important; margin: 0 !important; padding: 0 !important; border: 0 !important; max-width: none !important; max-height: none !important; z-index: 2147483647 !important; background: rgba(0, 200, 0, .92) !important; display: block !important;";
  window.ask = source => window.postMessage({ morseInstall: source }, "*");
  window.cover = (how, { through = false, again = false } = {}) => {
    const el = document.createElement(how === "dialog" ? "dialog" : "div");
    el.setAttribute("style", style + (through ? "pointer-events: none !important;" : ""));
    el.textContent = "Claim your prize";
    el.dataset.cover = how;
    let host = el;
    if (how === "shadow") {
      host = document.createElement("span");
      host.dataset.cover = how;
      host.attachShadow({ mode: "closed" }).append(el);
    }
    if (how === "popover" || how === "shadow") el.popover = "manual";
    document.body.append(host);
    const show = () => { try { if (how === "dialog") { if (el.open) el.close(); el.showModal(); } else if (how !== "z") { if (el.matches(":popover-open")) el.hidePopover(); el.showPopover(); } } catch {} };
    show();
    if (again) {
      // Morse's overlay or review came back on top: open ours again, on top of it.
      const t = setInterval(show, 120);
      covers.push(() => clearInterval(t));
    }
    covers.push(() => host.remove());
    window.covers = (window.covers || 0) + 1;
    return el;
  };
  window.uncover = () => { while (covers.length) covers.pop()(); };
}
</script>
</body>
</html>
