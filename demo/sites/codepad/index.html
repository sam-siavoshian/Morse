<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>main.js · Codepad</title>
<style>
  /* A small code editor with a command palette, to take features from (docs/bring-a-feature.md, tests/take-ui.test.js). */
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-rows: 35px 1fr 22px; grid-template-columns: 48px 220px 1fr; background: #1f1f1f; color: #cccccc; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  .title { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; background: #181818; border-bottom: 1px solid #2b2b2b; color: #9d9d9d; font-size: 12px; }
  .acts { background: #181818; border-right: 1px solid #2b2b2b; display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 12px; color: #858585; font-size: 18px; }
  .files { background: #181818; border-right: 1px solid #2b2b2b; padding: 8px 0; }
  .files h2 { margin: 0 0 6px; padding: 0 16px; font-size: 11px; font-weight: 600; letter-spacing: .06em; color: #9d9d9d; text-transform: uppercase; }
  .files div { padding: 3px 16px 3px 24px; color: #cccccc; cursor: pointer; }
  .files div.cur { background: #37373d; }
  .ed { background: #1f1f1f; padding: 12px 0; font: 14px/20px Menlo, Consolas, "DejaVu Sans Mono", monospace; color: #d4d4d4; overflow: auto; }
  .ed div { padding-left: 24px; white-space: pre; }
  .ed .k { color: #569cd6; } .ed .s { color: #ce9178; } .ed .c { color: #6a9955; }
  .status { grid-column: 1 / -1; display: flex; gap: 16px; align-items: center; padding: 0 10px; background: #181818; border-top: 1px solid #2b2b2b; color: #9d9d9d; font-size: 12px; }
  .status .msg { margin-left: auto; }
  /* the command palette: opens with Ctrl+Shift+P, filters as you type, ↑ ↓ and Enter, Esc or a click away closes it */
  .quick-input-widget { position: fixed; top: 44px; left: 50%; transform: translateX(-50%); width: 600px; background: #222222; color: #cccccc; border: 1px solid #454545; border-radius: 6px; box-shadow: 0 8px 24px rgba(0, 0, 0, .5); padding: 6px; z-index: 10; }
  .quick-input-widget input { width: 100%; height: 26px; padding: 0 8px; background: #313131; color: #cccccc; border: 1px solid #0078d4; border-radius: 4px; font: inherit; outline: 0; }
  .quick-input-list { list-style: none; margin: 6px 0 0; padding: 0; max-height: 260px; overflow: auto; }
  .quick-input-list li { display: flex; justify-content: space-between; padding: 3px 8px; border-radius: 3px; cursor: pointer; }
  .quick-input-list li kbd { font: 11px/16px inherit; color: #9d9d9d; background: #3a3a3a; border-radius: 3px; padding: 0 5px; }
  .quick-input-list li[aria-selected="true"] { background: #04395e; color: #ffffff; }
</style>
</head>
<body>
  <div class="title">main.js — codepad</div>
  <nav class="acts" aria-label="Activity bar"><span title="Explorer">⎘</span><span title="Search">⌕</span><span title="Source control">⑂</span></nav>
  <aside class="files" aria-label="Explorer"><h2>Explorer</h2><div class="cur">main.js</div><div>README.md</div><div>package.json</div></aside>
  <main class="ed" aria-label="Editor">
    <div><span class="c">// Codepad: press Ctrl+Shift+P for the command palette</span></div>
    <div><span class="k">import</span> { greet } <span class="k">from</span> <span class="s">"./greet.js"</span>;</div>
    <div></div>
    <div><span class="k">export function</span> main() {</div>
    <div>  greet(<span class="s">"world"</span>);</div>
    <div>}</div>
  </main>
  <footer class="status"><span>main</span><span>Ln 1, Col 1</span><span class="msg" role="status"></span></footer>
  <div class="quick-input-widget" role="dialog" aria-label="Command palette" style="display: none">
    <input aria-label="Type the name of a command to run." placeholder="Type the name of a command to run." spellcheck="false">
    <ul class="quick-input-list" role="listbox"></ul>
  </div>
<script>
  const COMMANDS = [["Toggle word wrap", "Alt+Z"], ["Format document", "Shift+Alt+F"], ["Go to line", "Ctrl+G"], ["Toggle sidebar", "Ctrl+B"], ["Zoom in", "Ctrl+="], ["Zoom out", "Ctrl+-"], ["Change color theme", ""], ["Close editor", "Ctrl+W"]];
  const w = document.querySelector(".quick-input-widget"), box = w.querySelector("input"), list = w.querySelector("ul"), msg = document.querySelector(".status .msg");
  let shown = [], at = 0;
  function render() {
    const q = box.value.trim().toLowerCase();
    shown = COMMANDS.filter(([n]) => n.toLowerCase().includes(q));
    at = Math.min(at, Math.max(0, shown.length - 1));
    list.innerHTML = shown.map(([n, k], i) => `<li role="option" aria-selected="${i === at}"><span>${n}</span>${k ? `<kbd>${k}</kbd>` : ""}</li>`).join("");
  }
  function open() { w.style.display = ""; box.value = ""; at = 0; render(); box.focus(); }
  function close() { w.style.display = "none"; }
  function run(i) { const c = shown[i]; close(); if (c) msg.textContent = `Ran “${c[0]}”`; }
  addEventListener("keydown", e => {
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "p") { e.preventDefault(); open(); }
  });
  box.addEventListener("input", () => { at = 0; render(); });
  box.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); at = Math.min(at + 1, shown.length - 1); render(); }
    if (e.key === "ArrowUp") { e.preventDefault(); at = Math.max(at - 1, 0); render(); }
    if (e.key === "Enter") { e.preventDefault(); run(at); }
    if (e.key === "Escape") { e.preventDefault(); close(); }
  });
  list.addEventListener("mousedown", e => e.preventDefault());
  list.addEventListener("click", e => { const li = e.target.closest("li"); if (li) run([...list.children].indexOf(li)); });
  box.addEventListener("blur", () => close()); // like VS Code: the palette closes when it loses focus
</script>
</body>
</html>
