<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ember · Local AI Chat</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">✦</div>
        <div>
          <div class="name">Ember</div>
          <div class="tag">local · private · yours</div>
        </div>
      </div>
      <button class="new-chat" id="new-chat">
        <span>＋</span> New chat
      </button>
      <div class="convos" id="convos"></div>
      <div class="sidebar-footer">
        <span>Runs on your machine</span>
        <a href="https://ollama.com" target="_blank" rel="noopener">Ollama ↗</a>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="model-picker">
          <span class="label">Model</span>
          <select id="model-select"></select>
        </div>
        <div class="status-pill warn" id="status"><span class="led"></span> Connecting…</div>
      </header>

      <div class="chat" id="chat"></div>

      <div class="composer-wrap">
        <div class="persona-bar">
          <span>Persona</span>
          <select id="persona-select"></select>
        </div>
        <div class="composer">
          <textarea id="composer-input" rows="1" placeholder="Message your local model…"></textarea>
          <button class="send-btn" id="send-btn" title="Send (Enter)">↑</button>
        </div>
        <div class="composer-hint">Enter to send · Shift+Enter for newline · nothing leaves your computer</div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
